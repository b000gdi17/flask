services:
  app:
    build: .
    container_name: flask
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      - mongodb
      - redis

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

volumes:
  mongo_data: